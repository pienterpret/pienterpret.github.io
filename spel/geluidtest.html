<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geluidtest</title>
<style>
body{font:17px/1.4 system-ui,sans-serif;max-width:640px;margin:20px auto;padding:0 14px;color:#222}
button{font:inherit;font-weight:700;padding:14px 18px;margin:6px 6px 6px 0;border-radius:12px;border:2px solid #c8102e;background:#fff;color:#c8102e;cursor:pointer}
button:active{background:#c8102e;color:#fff}
pre{background:#f4f4f4;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:14px}
h1{font-size:22px}
</style></head><body>
<h1>Geluidtest</h1>
<p>Zet het volume van je computer/telefoon aan. Druk op de knoppen en kijk of je iets hoort. Stuur een screenshot van deze pagina.</p>
<button id="b1">1. Piep (WebAudio)</button>
<button id="b2">2. Spraak</button>
<button id="b3">3. Piep (audio-element)</button>
<button id="b4">4. Alle Nederlandse stemmen testen</button>
<pre id="info"></pre>
<pre id="log"></pre>
<script>
const $=id=>document.getElementById(id), logEl=$('log'), t0=performance.now();
const log=m=>{ logEl.textContent=((performance.now()-t0)/1000).toFixed(2)+'s  '+m+'\n'+logEl.textContent; };
let ac=null;
function info(){
  let v=[]; try{ v=speechSynthesis.getVoices(); }catch(e){}
  const nl=v.filter(x=>/^nl/i.test(x.lang)).map(x=>x.name+' ('+x.lang+')');
  $('info').textContent=
   'Browser: '+navigator.userAgent+'\n'+
   'Adres: '+location.origin+'\n'+
   'AudioContext: '+(window.AudioContext||window.webkitAudioContext?'ja':'NEE')+'   toestand: '+(ac?ac.state:'(nog niet gemaakt)')+'\n'+
   'Spraak: '+('speechSynthesis' in window?'ja':'NEE')+'   stemmen: '+v.length+'   Nederlandse: '+(nl.join(', ')||'geen')+'\n'+
   'Geluid in spel aan/uit (sks-sound): '+(localStorage.getItem('sks-sound')||'(niet gezet = aan)')+'\n'+
   'Tabblad zichtbaar: '+document.visibilityState;
}
function ensure(){
  if(!ac){ const C=window.AudioContext||window.webkitAudioContext; ac=new C(); log('AudioContext gemaakt, toestand: '+ac.state); }
  if(ac.state!=='running'){ const r=ac.resume(); log('resume() aangeroepen, toestand nu: '+ac.state); if(r&&r.then) r.then(()=>{log('resume klaar, toestand: '+ac.state);info();},e=>log('resume mislukt: '+e)); }
  ac.onstatechange=()=>{log('toestand veranderd: '+ac.state);info();};
}
$('b1').onclick=()=>{ try{
  ensure();
  const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=660; o.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0.0001,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.4,ac.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.6);
  o.start(); o.stop(ac.currentTime+0.7); log('piep gestart (toestand '+ac.state+'). Hoor je een toon van een halve seconde?');
 }catch(e){ log('FOUT: '+e); } info(); };
const CHROME=/Chrome\//.test(navigator.userAgent)&&!/Edg\/|OPR\//.test(navigator.userAgent);
const score=v=>{ const l=(v.lang||'').toLowerCase().replace('_','-'),n=(v.name||'').toLowerCase(); let s;
  if(l.startsWith('nl-nl'))s=100;else if(l.startsWith('nl-be'))s=80;else if(l.startsWith('nl'))s=70;else return -1;
  if(/natural|neural/.test(n))s+=60; if(/online/.test(n))s+=45; if(/premium|enhanced|verbeterd|plus/.test(n))s+=50;
  if(/google/.test(n))s+=CHROME?200:35; if(/compact|espeak|robot/.test(n))s-=60; return s; };
const nlVoices=()=>speechSynthesis.getVoices().filter(v=>score(v)>=0).sort((x,y)=>score(y)-score(x));
function speakWith(voice,text){ return new Promise(res=>{   // resolves {ok, why}; never rejects
  const u=new SpeechSynthesisUtterance(text); u.lang=voice?voice.lang:'nl-NL'; if(voice)u.voice=voice; let started=false,done=false;
  const fin=r=>{ if(!done){done=true;clearTimeout(tm);res(r);} };
  u.onstart=()=>{started=true;}; u.onend=()=>fin({ok:started||true,why:'klaar'}); u.onerror=e=>fin({ok:false,why:e.error});
  const tm=setTimeout(()=>fin({ok:started,why:started?'klaar (geen einde-melding)':'geen reactie na 6 s'}),6000);
  speechSynthesis.speak(u); }); }
// 2: spreek met de beste stem; mislukt die direct, probeer de volgende (zoals het spel zelf doet)
$('b2').onclick=async()=>{ try{
  if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); await new Promise(r=>setTimeout(r,200)); }
  const list=nlVoices(); const tryList=list.concat([null]);
  for(const v of tryList){ const nm=v?v.name:'(alleen taal nl-NL)'; log('probeer stem: '+nm+' …');
    const r=await speakWith(v,'Hallo! Dit is een test van de stem.'); log('stem '+nm+': '+(r.ok?'GELUKT':'MISLUKT')+' ('+r.why+')');
    if(r.ok){ log('>>> Deze stem werkt: '+nm); break; } }
 }catch(e){ log('FOUT: '+e); } info(); };
// 4: alle Nederlandse stemmen één voor één
$('b4').onclick=async()=>{ try{
  if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); await new Promise(r=>setTimeout(r,200)); }
  for(const v of nlVoices()){ const r=await speakWith(v,'Dit is '+v.name.split(' ')[0]+'.'); log('stem '+v.name+' ('+v.lang+'): '+(r.ok?'GELUKT':'MISLUKT')+' ('+r.why+')'); await new Promise(r=>setTimeout(r,300)); }
  log('klaar met alle stemmen');
 }catch(e){ log('FOUT: '+e); } info(); };
$('b3').onclick=()=>{ try{
  // 0,5 s sinus 660 Hz als WAV
  const sr=8000,n=sr/2,buf=new ArrayBuffer(44+n*2),dv=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');dv.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)dv.setInt16(44+i*2,Math.sin(2*Math.PI*660*i/sr)*12000*Math.min(1,(n-i)/800),true);
  const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));
  a.play().then(()=>log('audio-element speelt'),e=>log('audio-element FOUT: '+e));
 }catch(e){ log('FOUT: '+e); } };
try{ speechSynthesis.onvoiceschanged=info; }catch(e){}
info(); setInterval(info,1500);
</script></body></html>
