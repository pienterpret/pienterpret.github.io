<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinterklaas Splitsen 🎁</title>
<meta name="theme-color" content="#a5121c">
<meta name="description" content="Oefen splitsen met Sinterklaas, Piet en de pepernoten!">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M20 92 C22 55 35 25 50 6 C65 25 78 55 80 92Z' fill='%23c8102e' stroke='%23f5c542' stroke-width='6'/%3E%3Crect x='45' y='30' width='10' height='45' fill='%23f5c542'/%3E%3Crect x='33' y='44' width='34' height='10' fill='%23f5c542'/%3E%3C/svg%3E">
<style>
:root{
  --z:1; /* >1 op grote schermen (digibord/4K), gezet door fitScale() */
  --red:#b5121b; --red-d:#760a12; --red-l:#d8323a;
  --gold:#f5c542; --gold-d:#c9971c; --gold-l:#ffe28a;
  --cream:#fff8e7; --ink:#5a1410; --brown:#8a4b1f;
  --it: clamp(22px, min(6.6vw, 6.1vh),calc(58px*var(--z)));
  --btn: clamp(48px, min(8.2vw, 10.5vh),calc(84px*var(--z)));
  --font: "Baloo 2", ui-rounded, "Nunito", "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font); color:var(--cream);
  background:radial-gradient(ellipse at 50% -10%, #e0353e 0%, var(--red) 38%, var(--red-d) 100%);
  overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0;background-image:var(--pat);background-size:220px 220px;opacity:.10;pointer-events:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(60,0,5,.45) 100%)}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
svg{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:1;
  height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}

/* ---------- generic buttons ---------- */
.big-btn{
  font-size:clamp(24px,4.2vmin,calc(40px*var(--z)));font-weight:800;color:var(--ink);
  background:linear-gradient(#ffe9a3,var(--gold) 55%,var(--gold-d));
  border-radius:999px;padding:.35em 1.2em .3em;
  box-shadow:0 6px 0 #8f6a0e, 0 10px 20px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7);
  display:inline-flex;align-items:center;gap:.4em;transition:transform .1s;
}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8f6a0e,0 4px 10px rgba(0,0,0,.3)}
.big-btn small{font-size:.6em;opacity:.8}
.big-btn.white{background:linear-gradient(#fff,#f3e6d0);box-shadow:0 6px 0 #b9a27c,0 10px 20px rgba(0,0,0,.3)}
.round-btn{width:clamp(44px,7vmin,calc(62px*var(--z)));height:clamp(44px,7vmin,calc(62px*var(--z)));border-radius:50%;
  background:linear-gradient(#ffe9a3,var(--gold) 60%,var(--gold-d));
  box-shadow:0 4px 0 #8f6a0e, 0 6px 12px rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
.round-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f6a0e}
.round-btn svg{width:60%;height:60%}
.round-btn.off{filter:grayscale(.8) brightness(.9)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- start screen ---------- */
#start{justify-content:center;gap:clamp(8px,2vh,calc(24px*var(--z)));text-align:center}
.title{margin:0;line-height:.9;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
.title .t1{display:block;font-size:clamp(34px,7vmin,calc(72px*var(--z)));color:var(--cream);font-weight:800;letter-spacing:.02em}
.title .t2{display:block;font-size:clamp(54px,13vmin,calc(130px*var(--z)));font-weight:800;
  color:var(--gold);-webkit-text-stroke:2px #8f6a0e;
  background:linear-gradient(#fff2b8,var(--gold) 50%,#e0a91f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,2vw,calc(30px*var(--z)));height:clamp(150px,34vh,calc(330px*var(--z)))}
.hero svg{height:100%;width:auto}
.hero .sint{animation:bob 3s ease-in-out infinite}
.hero .piet{height:82%;animation:bob 2.4s ease-in-out infinite .4s}
.hero .shoe{height:45%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.levels{display:flex;gap:clamp(12px,3vw,calc(32px*var(--z)));flex-wrap:wrap;justify-content:center}
.levels .big-btn{flex-direction:column;gap:0;padding:.3em 1.1em .35em;line-height:1}
.levels .lv-label{font-size:.55em;opacity:.85;font-weight:700}
.levels .lv-stars{display:flex;gap:4px;margin-top:4px}
.levels .lv-stars svg{width:.55em;height:.55em}
.sub{font-size:clamp(16px,2.6vmin,calc(24px*var(--z)));opacity:.9;margin:0;font-weight:600}

/* ---------- game: top bar ---------- */
.topbar{width:100%;display:flex;align-items:center;gap:clamp(8px,2vw,calc(18px*var(--z)));padding:clamp(6px,1.4vh,calc(14px*var(--z))) clamp(8px,2vw,calc(22px*var(--z)))}
.track{position:relative;flex:1;height:clamp(52px,9vh,calc(78px*var(--z)));border-radius:999px;overflow:hidden;
  background:linear-gradient(#6ec3f0,#2f86c9 55%,#1e5f9c);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 4px var(--gold),0 4px 0 4px #8f6a0e}
.waves{position:absolute;left:0;right:0;bottom:0;height:45%;opacity:.55;
  background:radial-gradient(circle at 10px -4px, transparent 12px, #bfe6ff 13px, transparent 15px) 0 0/28px 100% repeat-x;
  animation:waves 3s linear infinite}
@keyframes waves{to{background-position:28px 0}}
.track .end{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 10px;z-index:1}
.track .end.l{left:0}.track .end.r{right:0}
.track .end svg{height:70%;width:auto}
.dots{position:absolute;left:calc(clamp(52px,9vh,calc(78px*var(--z)))*1.0);right:calc(clamp(52px,9vh,calc(78px*var(--z)))*1.0);top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none}
.dot{width:clamp(10px,1.6vmin,calc(16px*var(--z)));height:clamp(10px,1.6vmin,calc(16px*var(--z)));border-radius:50%;background:rgba(255,255,255,.35);transition:all .4s}
.dot.done{background:none}
.dot.done svg{width:180%;height:180%;margin:-40%}
.boat{position:absolute;bottom:4%;height:88%;width:auto;z-index:2;transition:left 1.4s cubic-bezier(.45,.05,.3,1.2);animation:rock 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes rock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2px)}}

/* ---------- game: stage ---------- */
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:0 clamp(6px,2vw,calc(20px*var(--z))) clamp(6px,1.5vh,calc(16px*var(--z)));min-height:0}
.prompt{display:flex;align-items:center;gap:clamp(6px,1.5vw,calc(14px*var(--z)));max-width:min(96vw,calc(860px*var(--z)))}
.prompt .mini-piet{width:clamp(44px,8vmin,calc(72px*var(--z)));height:auto;flex:none;transition:transform .3s}
.prompt .mini-piet.jump{animation:jump .6s}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-8deg)}}
.bubble{position:relative;background:var(--cream);color:var(--ink);border-radius:22px;padding:.12em .7em .05em;
  font-size:clamp(26px,5vmin,calc(48px*var(--z)));font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.18);min-width:6em;text-align:center;white-space:nowrap;transition:background .3s}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--cream);border-left:0}
.bubble .q{color:var(--red);display:inline-block;animation:qpulse 1.2s ease-in-out infinite}
@keyframes qpulse{50%{transform:scale(1.2)}}
.bubble.good{background:#fff3c4}
.bubble.try{background:#ffe7e0}
.hint-btn{font-size:clamp(16px,2.6vmin,calc(24px*var(--z)));padding:.3em .8em .25em;gap:.3em}
.hint-btn svg{width:1.3em;height:1.3em}

/* split house */
.house{width:min(96vw,calc(780px*var(--z)),calc(var(--it)*15));display:flex;flex-direction:column;align-items:stretch;filter:drop-shadow(0 8px 0 rgba(60,0,5,.35))}
.roof{background:var(--gold);clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%);padding:7px 7px 0}
.roof-in{clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%);
  background:linear-gradient(#fffdf5,#ffefcc);display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--it)*.55) 10px calc(var(--it)*.22);gap:calc(var(--it)*.12)}
.rooms{display:flex;gap:7px;background:var(--gold);padding:7px;border-radius:0 0 22px 22px}
.room{flex:1;background:linear-gradient(#fffdf5,#ffefcc);border-radius:16px;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--it)*.15) 6px calc(var(--it)*.2);gap:calc(var(--it)*.12);transition:background .3s}
.num{font-size:calc(var(--it)*1.05);line-height:1;font-weight:800;color:var(--red);min-width:1.4em;text-align:center;
  border-radius:14px;padding:.08em .2em 0}
.roof .num{background:var(--red);color:var(--gold);border-radius:50%;width:1.55em;height:1.55em;display:grid;place-items:center;padding:0;padding-top:.06em;
  box-shadow:0 3px 0 var(--red-d),inset 0 0 0 3px var(--gold)}
.items{display:flex;flex-direction:column;align-items:center;gap:calc(var(--it)*.1);min-height:calc(var(--it)*var(--rows,1) + var(--it)*.1*(var(--rows,1) - 1))}
.row{display:flex;gap:calc(var(--it)*.1)}
.cell{position:relative;width:var(--it);height:var(--it);transition:opacity .4s,filter .4s,transform .3s}
.cell svg{width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.cell.pop{animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
.cell.gone{opacity:.25;filter:grayscale(1)}
.cell.count{transform:scale(1.15)}
.cell.count::after{content:attr(data-n);position:absolute;right:-10%;top:-18%;background:var(--red);color:#fff;font-weight:800;
  font-size:calc(var(--it)*.42);width:1.4em;height:1.4em;border-radius:50%;display:grid;place-items:center;line-height:1;padding-top:.1em;box-shadow:0 0 0 2px var(--gold)}
.room.missing{background:repeating-linear-gradient(45deg,#fff8e7 0 14px,#fff1d2 14px 28px);outline:4px dashed var(--red-l);outline-offset:-10px}
.room.missing .num{animation:qpulse 1.2s ease-in-out infinite}
.room.solved{background:linear-gradient(#fffbe0,#ffe58f)}
.room.known{}

/* number pad */
.pad{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.2vmin,calc(14px*var(--z)));max-width:min(98vw,calc(1100px*var(--z)))}
.nbtn{width:var(--btn);height:var(--btn);border-radius:22%;font-size:calc(var(--btn)*.56);font-weight:800;color:var(--red);line-height:1;padding-top:.08em;
  background:linear-gradient(#fffef8,#fff1cf);box-shadow:0 6px 0 var(--gold-d),0 9px 14px rgba(0,0,0,.28),inset 0 0 0 3px var(--gold);transition:transform .1s, opacity .3s}
.nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d),0 3px 6px rgba(0,0,0,.28),inset 0 0 0 3px var(--gold)}
.nbtn.wrong{animation:shake .45s;opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.nbtn.right{background:linear-gradient(#fff6c0,var(--gold));color:var(--red-d);transform:scale(1.15);box-shadow:0 0 0 5px #fff,0 0 30px 8px rgba(255,230,120,.9)}

/* popping characters */

/* end screen */
#end{justify-content:center;gap:clamp(8px,2.2vh,calc(24px*var(--z)));text-align:center}
#end h2{margin:0;font-size:clamp(48px,11vmin,calc(110px*var(--z)));color:var(--gold);line-height:.95;filter:drop-shadow(0 5px 0 rgba(0,0,0,.3))}
#end p{margin:0;font-size:clamp(20px,3.6vmin,calc(34px*var(--z)));font-weight:700}
.harbor{position:relative;width:min(92vw,calc(720px*var(--z)));height:clamp(120px,26vh,calc(240px*var(--z)));display:flex;align-items:flex-end;justify-content:center;gap:2vw}
.harbor svg{height:100%;width:auto}
.harbor .boat-big{height:80%;animation:rock 2.2s ease-in-out infinite;transform-origin:50% 90%}
.starrow{display:flex;gap:clamp(2px,1vw,calc(10px*var(--z)));flex-wrap:wrap;justify-content:center}
.starrow svg{width:clamp(30px,6vmin,calc(56px*var(--z)));height:clamp(30px,6vmin,calc(56px*var(--z)))}
.starrow svg.pop{animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.end-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

@media (orientation:portrait){
  :root{--it: clamp(22px, min(7.4vw, 5.2vh),calc(62px*var(--z))); --btn: clamp(52px, min(14vw, 8.2vh),calc(96px*var(--z)));}
  .pad{max-width:min(96vw, calc(var(--btn)*6.8))}
}
@media (max-width:520px){.topbar{gap:6px;padding-left:6px;padding-right:6px}.topbar .round-btn{width:40px;height:40px}.pill{font-size:14px;padding:.15em .45em .05em}}
@media (max-height:520px){ .hero{height:28vh} .prompt .mini-piet{display:none} }
/* ===== v2: start layout, lyrics, levels, music, animations ===== */
.round-btn{position:relative}
.round-btn.off::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:4px;margin-top:-2px;background:#5a1410;border-radius:2px;transform:rotate(-45deg)}
.corner{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 12px);display:flex;gap:10px;z-index:4}
#start{gap:clamp(6px,1.5vh,calc(16px*var(--z)))}
#start .title .t1{font-size:clamp(26px,5vmin,calc(56px*var(--z)))}
#start .title .t2{font-size:clamp(44px,9.5vmin,calc(104px*var(--z)))}
.start-main{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,calc(44px*var(--z)));flex-wrap:wrap;max-width:98vw}
#start .hero{height:clamp(120px,30vh,calc(300px*var(--z)))}
.lyrics{background:linear-gradient(#fffdf5,#ffefcc);color:var(--ink);border-radius:24px;border:5px solid var(--gold);
  box-shadow:0 7px 0 #8f6a0e,0 14px 24px rgba(0,0,0,.3);padding:clamp(8px,1.6vmin,calc(16px*var(--z))) clamp(12px,2.2vmin,calc(22px*var(--z)));width:min(94vw,calc(470px*var(--z)));text-align:left}
.lyrics h3{margin:0;font-size:clamp(18px,3.1vmin,calc(30px*var(--z)));color:var(--red);display:flex;align-items:center;gap:.35em;line-height:1.1}
.lyrics h3 svg{width:1.1em;height:1.1em}
.lyrics .wijs{margin:0 0 4px;font-size:clamp(12px,1.8vmin,calc(16px*var(--z)));opacity:.75;font-weight:600}
.lyrics .verse{min-height:calc(4 * 1.45em);font-size:clamp(17px,3vmin,calc(29px*var(--z)))}
.lyrics .line{font-weight:700;padding:0 .35em;border-radius:12px;line-height:1.45;transition:background .25s}
.lyrics .line.cur{background:var(--gold-l)}
.syl{display:inline-block;border-radius:7px;transition:transform .12s,color .12s,background .12s}
.syl.done{color:var(--red-d)}
.syl.on{color:#fff;background:var(--red);transform:scale(1.12);padding:0 .06em}
.levels .big-btn{position:relative}
.levels .big-btn.locked{filter:grayscale(.85) brightness(.85);box-shadow:0 6px 0 #6b5a3a,0 10px 20px rgba(0,0,0,.3)}
.levels .lock{width:.6em;height:.6em;margin-top:4px}
.levels .big-btn.nope{animation:shake .45s}
.pill{flex:none;background:var(--cream);color:var(--red);font-weight:800;font-size:clamp(16px,2.6vmin,calc(24px*var(--z)));border-radius:999px;padding:.15em .6em .05em;
  box-shadow:0 4px 0 var(--gold-d),inset 0 0 0 3px var(--gold);white-space:nowrap}
.pill.grow{animation:grow 1s ease}
@keyframes grow{0%,100%{transform:scale(1)}30%{transform:scale(1.45);background:var(--gold)}}
/* items up to 20 (rekenrek) */
.items{--sz:1;align-items:flex-start;min-height:calc(var(--it)*var(--sz)*var(--rows,1) + var(--it)*var(--sz)*.1*(var(--rows,1) - 1))}
.cell{width:calc(var(--it)*var(--sz));height:calc(var(--it)*var(--sz))}
.row .gap{width:calc(var(--it)*var(--sz)*.35);flex:none}
.cell.count::after{font-size:calc(var(--it)*var(--sz)*.45)}
.pad{--b:var(--btn)}
.nbtn{width:var(--b);height:var(--b);font-size:calc(var(--b)*.56)}
#game.lv3{--it:clamp(20px,min(6vw,5.4vh),calc(52px*var(--z)))}
#game.lv3 .pad{--b:calc(var(--btn)*.74);max-width:calc(var(--b)*11 + 10*clamp(6px,1.2vmin,calc(14px*var(--z))) + 2px)}
/* gallop Ozosnel */
.gallop{position:fixed;left:0;bottom:1vh;width:clamp(210px,36vmin,calc(360px*var(--z)));z-index:6;pointer-events:none;transform:translateX(-130%)}
.gallop svg{width:100%;height:auto;overflow:visible}
.gallop.run{animation:across 2.7s linear forwards}
@keyframes across{from{transform:translateX(-130%)}to{transform:translateX(calc(100vw + 30%))}}
.gallop.run .hbody{animation:hop .3s ease-in-out infinite alternate}
.gallop .leg{transform-box:fill-box;transform-origin:50% 0}
.gallop.run .leg{animation:legA .3s ease-in-out infinite alternate}
.gallop.run .leg.b{animation-name:legB}
.gallop.run .dust{animation:dust .6s ease-out infinite}
.gallop .dust{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes hop{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-12px) rotate(2.5deg)}}
@keyframes legA{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}
@keyframes legB{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes dust{0%{opacity:.8;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-30px,-10px) scale(1.6)}}
/* Piet tumbles off the roof */
.house{position:relative}
.tumble{position:absolute;width:calc(var(--it)*1.8);opacity:0;pointer-events:none;z-index:3}
.tumble svg{width:100%;height:auto}
.tumble.go{animation:tumble 2.3s forwards}
@keyframes tumble{
  0%{opacity:0;transform:translate(0,12px) rotate(0)}
  8%{opacity:1;transform:translate(0,0) rotate(0)}
  18%{transform:translate(0,0) rotate(-14deg)}
  28%{transform:translate(0,0) rotate(16deg)}
  36%{transform:translate(12%,-22%) rotate(40deg);animation-timing-function:ease-in}
  62%{transform:translate(38%,var(--fall)) rotate(360deg)}
  68%{transform:translate(38%,calc(var(--fall) - 28%)) rotate(360deg) scale(1.05,.95)}
  74%{transform:translate(38%,var(--fall)) rotate(360deg) scale(1.12,.86)}
  80%{transform:translate(38%,var(--fall)) rotate(360deg) scale(1)}
  86%{transform:translate(38%,var(--fall)) rotate(352deg)}
  92%{opacity:1;transform:translate(38%,var(--fall)) rotate(368deg)}
  100%{opacity:0;transform:translate(38%,var(--fall)) rotate(360deg)}
}
.cushion{position:absolute;width:calc(var(--it)*2.2);opacity:0;pointer-events:none;z-index:2}
.cushion svg{width:100%;height:auto}
.cushion.go{animation:cushion 2.3s forwards}
@keyframes cushion{0%,40%{opacity:0;transform:scale(.3)}52%{opacity:1;transform:scale(1)}62%{transform:scale(1)}66%{transform:scale(1.15,.7)}74%{transform:scale(1.1,.8)}82%{transform:scale(1)}92%{opacity:1}100%{opacity:0}}
.oei{position:absolute;font-weight:800;color:var(--gold);font-size:calc(var(--it)*.7);opacity:0;pointer-events:none;z-index:4;text-shadow:0 3px 0 var(--red-d)}
.oei.go{animation:oei 2.3s forwards}
@keyframes oei{0%,62%{opacity:0;transform:translateY(10px) scale(.5)}70%{opacity:1;transform:translateY(-10px) scale(1.15)}90%{opacity:1;transform:translateY(-16px) scale(1)}100%{opacity:0;transform:translateY(-24px)}}
@media (orientation:portrait){
  #start .hero{height:clamp(110px,20vh,calc(240px*var(--z)))}
  #game.lv3{--it:clamp(20px,min(6.6vw,4.6vh),calc(56px*var(--z)))}
}
/* ===== v3: bigger Piet tumble, Ozosnel variants, celebration ===== */
.tumble{width:clamp(110px,calc(var(--it)*3.4),calc(240px*var(--z)))}
.tumble.go{animation:tumble 2.8s forwards}
@keyframes tumble{
  0%{opacity:0;transform:translate(0,30px) scale(.6) rotate(0)}
  6%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}
  14%{transform:translate(0,0) rotate(-18deg)}
  22%{transform:translate(-4%,0) rotate(20deg)}
  30%{transform:translate(4%,-4%) rotate(-24deg)}
  36%{transform:translate(14%,-30%) rotate(30deg);animation-timing-function:ease-in}
  58%{transform:translate(38%,var(--fall)) rotate(720deg) scale(1)}
  63%{transform:translate(38%,var(--fall)) rotate(720deg) scale(1.25,.7)}
  70%{transform:translate(38%,calc(var(--fall) - 40%)) rotate(720deg) scale(.95,1.08)}
  77%{transform:translate(38%,var(--fall)) rotate(720deg) scale(1.15,.82)}
  82%{transform:translate(38%,calc(var(--fall) - 10%)) rotate(720deg) scale(1)}
  86%{transform:translate(38%,var(--fall)) rotate(712deg)}
  92%{opacity:1;transform:translate(38%,var(--fall)) rotate(728deg)}
  100%{opacity:0;transform:translate(38%,var(--fall)) rotate(720deg)}
}
.cushion{width:clamp(130px,calc(var(--it)*4.2),calc(300px*var(--z)))}
.cushion.go{animation:cushion 2.8s forwards}
@keyframes cushion{0%,34%{opacity:0;transform:scale(.3)}46%{opacity:1;transform:scale(1)}58%{transform:scale(1)}63%{transform:scale(1.2,.6)}70%{transform:scale(1)}77%{transform:scale(1.12,.78)}84%{transform:scale(1)}94%{opacity:1}100%{opacity:0}}
.oei{font-size:clamp(30px,calc(var(--it)*1.1),66px)}
.oei.go{animation:oei 2.8s forwards}
.dizzy{position:absolute;width:clamp(70px,calc(var(--it)*2),calc(150px*var(--z)));height:clamp(28px,calc(var(--it)*.8),calc(60px*var(--z)));opacity:0;pointer-events:none;z-index:4}
.dizzy .ring{position:absolute;inset:0;animation:dz 1s linear infinite}
.dizzy svg{position:absolute;width:32%;height:auto}
.dizzy svg:nth-child(1){left:0;top:30%}.dizzy svg:nth-child(2){left:34%;top:-20%}.dizzy svg:nth-child(3){right:0;top:30%}
.dizzy.go{animation:dizzy 2.8s forwards}
@keyframes dizzy{0%,74%{opacity:0}80%,94%{opacity:1}100%{opacity:0}}
@keyframes dz{from{transform:scaleY(.55) rotate(0)}to{transform:scaleY(.55) rotate(360deg)}}

.gallop{position:fixed;left:0;top:0;bottom:auto;width:clamp(210px,34vmin,calc(360px*var(--z)));z-index:6;pointer-events:none;transform:translate(-300vw,0);animation:none}
.gallop > svg{width:100%;height:auto;overflow:visible;display:block}
.leg{transform-box:fill-box;transform-origin:50% 0}
.head{transform-box:fill-box;transform-origin:15% 85%}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .35s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-30deg)}to{transform:rotate(25deg)}}
.gallop[class*="v-"] .hbody,.dancer.horse .hbody{animation:hop .3s ease-in-out infinite alternate}
.gallop[class*="v-"] .leg,.dancer.horse .leg{animation:legA .3s ease-in-out infinite alternate}
.gallop[class*="v-"] .leg.b,.dancer.horse .leg.b{animation-name:legB}
.gallop.v-run{animation:hx 2.7s linear forwards}
.gallop.v-sky{animation:hx 3s linear forwards}
.gallop.v-trot{animation:hx 3.8s linear forwards}
.gallop.v-trot .hbody,.gallop.v-trot .leg{animation-duration:.45s}
@keyframes hx{from{transform:translate(var(--sx),var(--y))}to{transform:translate(var(--ex),var(--y))}}
.gallop.v-jump{animation:hjump 2.9s forwards}
@keyframes hjump{
  0%{transform:translate(var(--sx),var(--y)) rotate(0);animation-timing-function:linear}
  28%{transform:translate(var(--x1),var(--y)) rotate(-14deg);animation-timing-function:ease-out}
  50%{transform:translate(var(--xm),var(--py)) rotate(0deg);animation-timing-function:ease-in}
  72%{transform:translate(var(--x2),var(--y)) rotate(12deg);animation-timing-function:linear}
  80%{transform:translate(calc(var(--x2) + 6vw),var(--y)) rotate(0)}
  100%{transform:translate(var(--ex),var(--y)) rotate(0)}}
.gallop.v-rear{animation:hrear 2.9s forwards;transform-origin:28% 92%}
.gallop.v-rear .hbody{animation:none}
.gallop.v-rear .leg{animation-duration:.16s}
@keyframes hrear{
  0%{transform:translate(var(--xm),100vh) rotate(0)}
  16%{transform:translate(var(--xm),var(--y)) rotate(0)}
  30%{transform:translate(var(--xm),var(--y)) rotate(-27deg)}
  40%{transform:translate(var(--xm),var(--y)) rotate(-20deg)}
  50%{transform:translate(var(--xm),var(--y)) rotate(-29deg)}
  62%{transform:translate(var(--xm),var(--y)) rotate(0)}
  82%{transform:translate(var(--xm),var(--y)) rotate(0)}
  100%{transform:translate(var(--xm),100vh) rotate(0)}}
.gallop.v-peek{animation:hpeek 3.4s forwards}
.gallop.v-peek .hbody,.gallop.v-peek .leg{animation:none}
.gallop.v-peek .head{animation:chomp .27s ease-in-out .8s 6 alternate}
@keyframes hpeek{0%{transform:translate(var(--sx),var(--y))}22%,82%{transform:translate(var(--px),var(--y))}100%{transform:translate(var(--sx),var(--y))}}
@keyframes chomp{from{transform:rotate(0)}to{transform:rotate(10deg)}}
.snack{position:absolute;left:92%;top:30%;width:20%;opacity:0}
.snack svg{width:100%;height:auto;transform:rotate(90deg)}
.gallop.v-peek .snack{animation:snack 3.4s forwards}
@keyframes snack{0%,18%{opacity:0;transform:scale(.4);clip-path:inset(0 0 0 0)}24%,36%{opacity:1;transform:scale(1);clip-path:inset(0 0 0 0)}
  40%,50%{clip-path:inset(0 0 0 32%)}54%,62%{clip-path:inset(0 0 0 62%)}66%{opacity:1;clip-path:inset(0 0 0 100%)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}

/* celebration screen */
#end{justify-content:center;gap:clamp(6px,1.4vh,calc(14px*var(--z)));padding-top:max(8px,env(safe-area-inset-top))}
#end h2{font-size:clamp(40px,8vmin,calc(90px*var(--z)))}
#end p{font-size:clamp(16px,2.8vmin,calc(28px*var(--z)))}
.cel-top{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,calc(24px*var(--z)));flex-wrap:wrap}
.cel-main{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,calc(30px*var(--z)));flex-wrap:wrap;max-width:98vw}
.scene{position:relative;width:min(94vw,calc(600px*var(--z)));height:clamp(170px,38vh,calc(340px*var(--z)));border-radius:26px;overflow:hidden;
  border:5px solid var(--gold);box-shadow:0 7px 0 #8f6a0e,0 14px 24px rgba(0,0,0,.3);
  background:linear-gradient(#8fd3ff 0%,#cfeeff 45%,#ffe9b8 70%)}
.scene .bunting{position:absolute;left:0;top:0;width:100%;height:22%}
.scene .sea{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#3d9ad8,#1e5f9c)}
.scene .sea::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10px -4px,transparent 12px,#bfe6ff 13px,transparent 15px) 0 6px/28px 100% repeat-x;opacity:.6;animation:waves 3s linear infinite}
.scene .quay{position:absolute;right:0;bottom:0;width:56%;height:34%;
  background:repeating-linear-gradient(0deg,#9b4a2c 0 12px,#e9d7c0 12px 14px),#9b4a2c;border-top:8px solid #c9b8a3;border-radius:10px 0 0 0;box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.scene > svg,.scene .dancer{position:absolute}
.scene .boat-docked{left:1%;bottom:12%;height:58%;width:auto;animation:rock 2.4s ease-in-out infinite;transform-origin:50% 90%}
.dancer{animation:dance .5s ease-in-out infinite alternate;transform-origin:50% 100%}
.dancer.p1{left:43%;bottom:32%;height:34%}
.dancer.p2{right:2%;bottom:32%;height:34%;animation-delay:.25s}
.dancer.p3{left:20%;bottom:44%;height:26%;animation-delay:.12s;display:none}
#end.fest .dancer.p3{display:block}
.dancer.horse{left:54%;bottom:30%;width:30%;animation:none}
.dancer.horse svg{width:100%;height:auto;overflow:visible}
.dancer svg{height:100%;width:auto}
@keyframes dance{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-14%) rotate(7deg)}}
#end .lyrics{width:min(94vw,calc(470px*var(--z)))}
#end .lyrics .verse{font-size:clamp(15px,2.6vmin,calc(25px*var(--z)))}
.end-btns .big-btn{font-size:clamp(18px,3vmin,calc(30px*var(--z)))}
#end.fest h2{animation:pulse 1s ease-in-out infinite}
@media (orientation:portrait){ .scene{height:clamp(160px,24vh,calc(300px*var(--z)))} }
</style>

:root{--font:"SKS Baloo","Baloo 2",ui-rounded,"Nunito","Arial Rounded MT Bold","Chalkboard SE",system-ui,sans-serif;
  --btn: clamp(64px, min(8.2vw, 10.5vh), 88px)}
@media (orientation:portrait){:root{--btn: clamp(60px, min(15.5vw, 8.4vh), 96px)}}
/* decorative layers */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg > *{position:absolute;transition:opacity .5s}
.bg svg{width:100%;height:100%;overflow:visible}
body:has(#game.active) .bg .dim{opacity:.32}
body:has(#game.active) .bg .off-game{opacity:0}
.hero{position:relative;isolation:isolate}
.hero-deco{position:absolute;z-index:-1;pointer-events:none}
.hero-deco svg{width:100%;height:100%;overflow:visible}
.scene-deco{position:absolute;inset:0;pointer-events:none}
.scene-deco svg{width:100%;height:100%}
/* feedback polish */
.room{position:relative}
.room.solved{animation:solvedpop .6s cubic-bezier(.3,1.7,.6,1)}
@keyframes solvedpop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.room.solved::after{content:"";position:absolute;right:10px;top:10px;width:clamp(26px,calc(var(--it)*.8),48px);aspect-ratio:1;
  background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22%232fb34a%22 stroke=%22%23fff%22 stroke-width=%223%22/%3E%3Cpath d=%22M11 21 l6 6 l12 -13%22 stroke=%22%23fff%22 stroke-width=%225%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E") center/contain no-repeat;animation:pop .5s .1s cubic-bezier(.3,1.6,.6,1) both}
.bubble.try{animation:shake .45s}
.bubble.good{animation:pop .45s cubic-bezier(.3,1.6,.6,1)}
#game.lv3 .pad{--b:max(52px, calc(var(--btn)*.74))}
@media (orientation:portrait){ #game.lv3 .pad{--b:max(50px, calc(var(--btn)*.8))} }

/* ---------- combi: worlds ---------- */
:root{--btn: clamp(64px, min(8.2vw, 10.5vh), calc(88px*var(--z,1)))}
@media (orientation:portrait){:root{--btn: clamp(60px, min(15.5vw, 8.4vh), calc(96px*var(--z,1)))}}
.bg > .w{position:absolute;inset:0;display:none}
.bg .w > *{position:absolute;transition:opacity .5s}
body.theme-snoep .bg .w-snoep, body.theme-pakjes .bg .w-pakjes, body.theme-boot .bg .w-boot{display:block}
.hero-deco,.scene-deco{display:none}
body.theme-snoep .hd-snoep, body.theme-pakjes .hd-pakjes, body.theme-boot .hd-boot{display:block}
body{transition:background .4s}
.worlds{display:flex;gap:clamp(18px,2.4vw,28px);justify-content:center;align-items:center;padding:4px 10px;
  background:rgba(255,255,255,.16);border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
body.theme-snoep .worlds{background:rgba(232,32,58,.08);box-shadow:inset 0 0 0 2px rgba(232,32,58,.18)}
.wbtn{position:relative;width:clamp(64px,8vmin,80px);height:clamp(64px,8vmin,80px);border-radius:50%;padding:0;flex:none;
  box-shadow:0 0 0 4px #fff,0 6px 0 4px rgba(0,0,0,.22),0 10px 18px rgba(0,0,0,.25);transition:transform .15s, box-shadow .15s}
.wbtn svg{width:100%;height:100%;border-radius:50%}
.wbtn:active{transform:translateY(3px) scale(.96)}
.wbtn[aria-pressed="true"]{transform:scale(1.12);box-shadow:0 0 0 5px #ffd23f,0 0 0 9px #fff,0 8px 0 9px rgba(0,0,0,.2),0 0 26px 10px rgba(255,214,90,.55)}
.wbtn[aria-pressed="true"]::after{content:"";position:absolute;right:-8px;top:-8px;width:28px;height:28px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22%232fb34a%22 stroke=%22%23fff%22 stroke-width=%223%22/%3E%3Cpath d=%22M11 21 l6 6 l12 -13%22 stroke=%22%23fff%22 stroke-width=%225%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E") center/contain no-repeat}
.wbtn.bounce{animation:pop .45s cubic-bezier(.3,1.6,.6,1)}
@media (max-height:700px) and (orientation:landscape){ .wbtn{width:64px;height:64px} }

  font-size:clamp(16px,2.6vmin,calc(24px*var(--z)));color:#4a130e;background:linear-gradient(#fff3a6,#ffd23f 60%,#f0b400);box-shadow:0 5px 0 #c48a00,0 8px 14px rgba(0,0,0,.25)}
.snd-pill:active{transform:translateY(3px);box-shadow:0 2px 0 #c48a00}
.snd-pill svg{width:34px;height:34px;flex:none}
.snd-pill.off{background:linear-gradient(#e9e4dc,#cfc7ba);color:#5a1410;box-shadow:0 5px 0 #8f8678,0 8px 14px rgba(0,0,0,.25)}
.corner-l{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 12px);z-index:4}
.name-chip{display:inline-flex;align-items:center;gap:.45em;min-height:56px;max-width:min(46vw,320px);padding:0 16px 0 12px;border-radius:999px;border:0;cursor:pointer;font:inherit;font-weight:800;
  font-size:clamp(16px,2.6vmin,calc(24px*var(--z)));color:var(--red);background:var(--cream);box-shadow:0 5px 0 #b9861c,0 8px 14px rgba(0,0,0,.25)}
.name-chip:active{transform:translateY(3px);box-shadow:0 2px 0 #b9861c}
.name-chip svg{width:28px;height:28px;flex:none}
.name-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.snd-pill .lbl{display:none}.snd-pill{padding:0 10px}.name-chip{max-width:48vw;font-size:16px}}
.name-tag{position:absolute;left:clamp(8px,2vw,22px);top:calc(100% - 4px);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--cream);color:var(--red);font-weight:800;font-size:clamp(13px,2.2vmin,calc(20px*var(--z)));line-height:1.1;border-radius:999px;padding:.2em .8em;box-shadow:0 2px 0 rgba(0,0,0,.25);z-index:2;pointer-events:none}
.name-tag:empty{display:none}
#nameScr{overflow-y:auto;justify-content:flex-start;gap:clamp(8px,2vh,20px);touch-action:pan-y;padding-left:12px;padding-right:12px}
#nameScr>:first-child{margin-top:auto}#nameScr>:last-child{margin-bottom:auto}#nameScr>*{flex-shrink:0}
#nameScr .name-piet{height:clamp(110px,24vh,calc(220px*var(--z)));width:auto}
#nameScr .lyrics.name-card{width:min(94vw,calc(520px*var(--z)));text-align:center;display:flex;flex-direction:column;align-items:stretch;gap:clamp(8px,1.6vh,16px);padding:clamp(14px,2.4vmin,26px)}
#nameScr label{font-weight:800;font-size:clamp(28px,5.6vmin,calc(52px*var(--z)));color:var(--red);line-height:1.05}
#nameScr input{width:100%;box-sizing:border-box;font:inherit;font-weight:700;font-size:clamp(26px,4.6vmin,calc(44px*var(--z)));text-align:center;color:#3b0d1c;background:#fff;
  border:4px solid var(--gold);border-radius:20px;padding:.35em .4em;min-height:64px;outline:none;-webkit-appearance:none;appearance:none}
#nameScr input:focus{border-color:#e8203a;box-shadow:0 0 0 4px rgba(232,32,58,.25)}
#nameScr .name-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#nameScr .name-btns .big-btn{flex:1 1 150px;font-size:clamp(22px,3.6vmin,calc(36px*var(--z)));min-height:64px}
#nameScr .name-note{margin:0;font-size:clamp(13px,2vmin,calc(18px*var(--z)));color:#6b4a3a;font-weight:600}
#nameScr .name-wipe{background:none;border:0;font:inherit;font-weight:700;color:#6b4a3a;text-decoration:underline;min-height:44px;cursor:pointer}
.endwho{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--cream);color:var(--red);border-radius:28px;padding:.25em 1em .3em;box-shadow:0 5px 0 #b9861c,0 10px 18px rgba(0,0,0,.3);text-align:center;max-width:94vw}
.endwho b{font-size:clamp(26px,5.4vmin,calc(54px*var(--z)));line-height:1.05;overflow-wrap:anywhere}
.endwho span{font-size:clamp(16px,2.8vmin,calc(28px*var(--z)));font-weight:700;color:#3b0d1c}
/* end screen: scroll when content is taller than the screen (phones); centred otherwise */
#end{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;justify-content:flex-start;touch-action:pan-y}
#end>:first-child{margin-top:auto}
#end>:last-child{margin-bottom:auto}
#end>*{flex-shrink:0}
</style>
</head>

<script>
/* ===== combi: world chooser (Snoepwinkel / Pakjesavond / Stoomboot). Pure presentation; no game logic. =====
   Called by the game via window.skWorld(level): level 1-3 when a round starts, 0 when the start screen is shown. */
(() => {
  const PER_LEVEL = { 1: 'snoep', 2: 'pakjes', 3: 'boot' };      // 'Automatisch' mapping
  const START_DEFAULT = 'pakjes';                                // neutral start screen, matches the red/gold landing page
  const COLOR = { snoep: '#e8203a', pakjes: '#8e0f17', boot: '#0c1a40' };
  const KEY = 'sks-world';
  const pref = () => { try { const v = localStorage.getItem(KEY); return ['auto', 'snoep', 'pakjes', 'boot'].includes(v) ? v : 'auto'; } catch (e) { return 'auto'; } };
  function apply(w) {
    document.body.classList.remove('theme-snoep', 'theme-pakjes', 'theme-boot');
    document.body.classList.add('theme-' + w);
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = COLOR[w];
  }
  window.skWorld = level => {
    const p = pref();
    apply(p === 'auto' ? (level ? PER_LEVEL[level] : START_DEFAULT) : p);
    document.querySelectorAll('#worlds .wbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.world === p)));
  };
  function speak(t) {   // read the world name aloud via the game's shared speech queue (same voice, same mute); a button tap is deliberate, so it may interrupt
    try { if (window.sksSay) window.sksSay(t, { interrupt: true }); } catch (e) {}
  }
  const SAY = { auto: 'Automatisch. Elke level een andere wereld!', snoep: 'De snoepwinkel!', pakjes: 'Pakjesavond bij de open haard!', boot: 'De stoomboot, in de nacht!' };
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('#worlds .wbtn').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      try { localStorage.setItem(KEY, b.dataset.world); } catch (err) {}
      window.skWorld(0); b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce');
      speak(SAY[b.dataset.world]);
    }));
  });
  apply(START_DEFAULT);
})();
</script>
<script>
(() => {
'use strict';
/* ---------- background pattern (mijter, staf, pepernoten) ---------- */
const pat = `<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'>
<g fill='none' stroke='#f5c542' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'>
<path d='M25 95 C27 65 38 42 55 26 C72 42 83 65 85 95Z'/><path d='M55 45v34M43 58h24'/>
<path d='M160 200 V110 Q160 82 182 82 Q202 82 202 100 Q202 116 186 116'/>
<path d='M120 30l4 9 10 1-8 6 3 10-9-6-9 6 3-10-8-6 10-1z'/>
</g>
<g fill='#f5c542'><circle cx='40' cy='170' r='9'/><circle cx='62' cy='185' r='7'/><circle cx='110' cy='140' r='6'/></g>
</svg>`;
document.body.style.setProperty('--pat', `url("data:image/svg+xml,${encodeURIComponent(pat)}")`);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const ROUND = 10;
const UNLOCK_STARS = 7;            // gold stars in one round needed to open the next level

const ITEMS = [
  { id: 'pepernoot', one: 'pepernoot', many: 'pepernoten' },
  { id: 'cadeau', one: 'cadeautje', many: 'cadeautjes' },
  { id: 'wortel', one: 'wortel', many: 'wortels' },
  { id: 'letter', one: 'chocoladeletter', many: 'chocoladeletters' },
];
const CHEERS = ['Goed zo!', 'Super!', 'Hoera!', 'Knap hoor!', 'Top!', 'Prima!', 'Wauw!', 'Heel goed!'];
const CHEER_SAY = ['Goed zo!', 'Super!', 'Hoera!', 'Knap hoor!', 'Sinterklaas is trots op je!', 'Piet zegt: top!', 'Wauw, heel goed!', 'Prima gedaan!'];
const TRY = ['Bijna!', 'Probeer nog eens!', 'Nog een keer!'];

/* ---------- levels + gentle adaptive range ---------- */
// lo: smallest total used, start: first max, cap: highest max of the level
const LEVELS = {
  1: { lo: 2, start: 3, cap: 5, name: 'tot 5' },
  2: { lo: 4, start: 6, cap: 10, name: 'tot 10' },
  3: { lo: 8, start: 11, cap: 20, name: 'tot 20' },
};
function loadProg() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('sks-prog') || '{}') || {}; } catch (e) {}
  p.unlocked = Math.min(3, Math.max(1, p.unlocked || 1));
  p.cur = Object.assign({ 1: LEVELS[1].start, 2: LEVELS[2].start, 3: LEVELS[3].start }, p.cur || {});
  p.best = p.best || {};
  for (const lv of [1, 2, 3]) p.cur[lv] = Math.min(LEVELS[lv].cap, Math.max(LEVELS[lv].start, +p.cur[lv] || LEVELS[lv].start));
  return p;
}
let prog = loadProg();
const saveProg = () => localStorage.setItem('sks-prog', JSON.stringify(prog));

/* ---------- pure math logic (also used by tests) ---------- */
function makeQuestion(level, prev, curMax) {
  const L = LEVELS[level];
  curMax = Math.min(L.cap, Math.max(L.start, curMax || L.start));
  const lo = Math.max(L.lo, curMax - 4);
  let total, known, tries = 0;
  do {
    total = Math.random() < 0.45 ? curMax : rand(lo, curMax);
    if (level === 1) known = rand(1, total - 1);
    else known = Math.random() < 0.07 ? pick([0, total]) : rand(1, total - 1);
    tries++;
  } while (prev && prev.total === total && prev.known === known && tries < 20);
  const missing = Math.random() < 0.3 ? 'left' : 'right';
  const item = pick(ITEMS.filter(i => !prev || i.id !== prev.item.id));
  const answer = total - known;
  return { total, known, answer, missing, item,
           left: missing === 'left' ? answer : known,
           right: missing === 'right' ? answer : known };
}
function checkAnswer(q, n) { return n === q.total - q.known && q.left + q.right === q.total; }
// returns new curMax after a solved question (streak logic lives in st)
function adapt(level, curMax, s, attempts) {
  const L = LEVELS[level];
  if (attempts === 0) {
    s.streak++; s.miss = 0;
    if (s.streak >= 3 && curMax < L.cap) { s.streak = 0; return curMax + 1; }
  } else {
    s.streak = 0;
    if (attempts >= 2) { s.miss++; if (s.miss >= 2 && curMax > L.start) { s.miss = 0; return curMax - 1; } }
  }
  return curMax;
}

/* ---------- state ---------- */
const st = { level: 1, idx: 0, stars: 0, results: [], q: null, attempts: 0, busy: false, hint: false, streak: 0, miss: 0 };
let soundOn = localStorage.getItem('sks-sound') !== 'off';

/* ---------- audio (WebAudio) ---------- */
let ac = null, master = null, outG = null, duckUntil = 0;
function ensureAudio() {

let nameBack = 'start';
function renderName() {
  $('nameChipTxt').textContent = pname ? 'Hoi ' + pname + '!' : 'Wie ben jij?';
  $('nameTag').textContent = pname;
}
function openName(back) {
  nameBack = back || 'start';
  cancelGame && nameBack === 'start' && cancelGame();
  $('nameInput').value = pname;
  $('nameWipe').style.display = pname ? '' : 'none';
  $('nameSkip').textContent = localStorage.getItem('sks-named') ? 'Terug' : 'Overslaan';
  show('nameScr');
}
function closeName(saved) {
  localStorage.setItem('sks-named', '1');
  renderName(); renderStart(); show('start');
  if (saved && pname) say('Hoi ' + pname + '!');
}
$('nameChip').addEventListener('click', e => { e.stopPropagation(); ensureAudio(); openName('start'); });
$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  pname = cleanName($('nameInput').value);
  if (pname) localStorage.setItem('sks-name', pname); else localStorage.removeItem('sks-name');
  closeName(true);
});
$('nameSkip').addEventListener('click', () => closeName(false));
$('nameWipe').addEventListener('click', () => { pname = ''; localStorage.removeItem('sks-name'); $('nameInput').value = ''; closeName(false); });
renderName(); updateSoundIcon();
if (!localStorage.getItem('sks-named')) openName('start');

/* ---------- wiring ---------- */
[1, 2, 3].forEach(lv => $('lv' + lv).addEventListener('click', () => levelClick(lv)));
$('againBtn').addEventListener('click', () => { leaveEnd(); startRound(st.level); });
$('singAgainBtn').addEventListener('click', () => { ensureAudio(); voiceStop(); startCel(); });
$('skipBtn').addEventListener('click', () => { stopCel(); });
$('otherBtn').addEventListener('click', () => {
  leaveEnd(); const g = $('otherBtn').dataset.go;
  if (g && g !== 'menu') startRound(+g); else { renderStart(); show('start'); }
});
$('homeBtn').addEventListener('click', () => { cancelGame(); renderStart(); show('start'); });
$('sayBtn').addEventListener('click', () => { ensureAudio(); if (st.q) say(questionText(st.q) + ' ' + INSTRUCTION, { interrupt: true }); });
$('hintBtn').addEventListener('click', () => { SFX.tap(); showHint(true); });
function toggleSound() {
  soundOn = !soundOn; localStorage.setItem('sks-sound', soundOn ? 'on' : 'off');
  ensureAudio();
  if (outG) { outG.gain.cancelScheduledValues(ac.currentTime); outG.gain.setValueAtTime(soundOn ? 1 : 0, ac.currentTime); }
  if (!soundOn) { voiceStop(); try { speechSynthesis.cancel(); } catch (e) {} }
  updateSoundIcon();
  if (soundOn) SFX.tap();
}
$('soundBtn').addEventListener('click', toggleSound);
$('soundBtnStart').addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
// unlock on every kind of gesture, and again on each tap while the context is not running (iOS may suspend it any time)
['touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlockAudio, { capture: true, passive: true }));
// scale caps up on large screens (digibord, 4K); phones/tablets stay at --z = 1
function fitScale() {
  const z = Math.max(1, Math.min(innerWidth / 1440, innerHeight / 900, 3));
  document.documentElement.style.setProperty('--z', z.toFixed(3));
}
fitScale();
addEventListener('resize', () => { fitScale(); if ($('game').classList.contains('active')) moveBoat(); });
// no double-tap / pinch zoom while playing (touch-action:manipulation covers most browsers; this covers old iOS)
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
addEventListener('keydown', e => {
  if (!$('game').classList.contains('active') || !st.q) return;
  if (/^[0-9]$/.test(e.key)) {
    const n = +e.key; const btn = $('pad').children[n];
    if (btn) onAnswer(n, btn);
  }
});
updateSoundIcon(); renderStart(); renderVerse(SONG_FEEST, 0);
$('danceHorse').innerHTML = horseSVG('sint');
$('flags').innerHTML = Array.from({ length: 16 }, (_, i) => { const x = i * 38 + 6, y = 8 + 32 * Math.sin(Math.PI * (x + 12) / 600) * 0.95;
  return `<path d="M${x} ${y} l24 0 l-12 22z" fill="${['#c8102e', '#ffffff', '#21468b', '#f5c542'][i % 4]}"/>`; }).join('');

// test hook
window.__splits = { makeQuestion, checkAnswer, adapt, LEVELS, STOOMBOOT, state: st, get prog() { return prog; },
  music: Music, startRound, tumble, ozosnel, OZO, FEEST, SONG_FEEST, startCel, stopCel, endRound, songBeats, questionText, cancelGame, get pendingTimers() { return gameTimers.size; }, INSTRUCTION, fitScale, get voice() { return voice; }, voiceScore,
  get soundOn() { return soundOn; }, get unlock() { return { state: ac && ac.state, bufUnlocked }; }, SFX, get ac() { return ac; }, get outG() { return outG; },
  speech: { get active() { return vActive; } } };
})();
</script>
</body>
</html>
